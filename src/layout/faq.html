<div class="faq">
  <div class="faqContainer">
    <span class="faqTitle bold">FAQ</span>

    <div id="faq">
      <div class="faqQuestion">
        <div class="faqQuestionTexContainer">
          <span class="faqQuestionNumber">01</span>
          <div class="faqQuestionTextWrapper" id="q:1">
            <span class="faqQuestionText">
              Як відбувається вступ до спільноти?
            </span>
            <span class="faqQuestionAnswer normal"></span>
          </div>
        </div>

        <div class="faqBtnContainer">
          <div class="faqBtnWrapper" id="qBtn:1">
            <img
              class="faqBtnPlus"
              src="./images/plus.png"
              alt="Плюс"
              id="plus:1"
            />
            <img
              class="faqBtnMinus is-hiden"
              src="./images/minus.png"
              alt="Мінус"
              id="minus:1"
            />
          </div>
        </div>
      </div>

      <div class="faqQuestion">
        <div class="faqQuestionTexContainer">
          <span class="faqQuestionNumber">02</span>
          <div class="faqQuestionTextWrapper" id="q:2">
            <span class="faqQuestionText">Що буде після оплати?</span>
            <span class="faqQuestionAnswer normal">
              Ти одразу отримаєш доступ до бази знань, нашого чату і всіх іншіх
              плюшок нашої закритої спільноти для дизайнерів та no-code
              розробників
            </span>
          </div>
        </div>

        <div class="faqBtnContainer">
          <div class="faqBtnWrapper" id="qBtn:2">
            <img
              class="faqBtnPlus"
              src="./images/plus.png"
              alt="Плюс"
              id="plus:2"
            />
            <img
              class="faqBtnMinus is-hiden"
              src="./images/minus.png"
              alt="Мінус"
              id="minus:2"
            />
          </div>
        </div>
      </div>

      <div class="faqQuestion">
        <div class="faqQuestionTexContainer">
          <span class="faqQuestionNumber">03</span>
          <div class="faqQuestionTextWrapper" id="q:3">
            <span class="faqQuestionText">
              Хто може стати учасником спільноти?
            </span>
            <span class="faqQuestionAnswer normal"></span>
          </div>
        </div>

        <div class="faqBtnContainer">
          <div class="faqBtnWrapper" id="qBtn:3">
            <img
              class="faqBtnPlus"
              src="./images/plus.png"
              alt="Плюс"
              id="plus:3"
            />
            <img
              class="faqBtnMinus is-hiden"
              src="./images/minus.png"
              alt="Мінус"
              id="minus:3"
            />
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
