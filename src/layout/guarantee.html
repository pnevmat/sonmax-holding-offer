<div class="guarantee">

    <div class="guaranteeCard">
      <div class="guaranteeTextContainer">
        <picture>
          <source srcset="./images/guaranteer.png?as=avif" type="image/avif" />
          <source srcset="./images/guaranteer.png?as=webp" type="image/webp" />

      <div class="guaranteeSignContainer">

          <source srcset="./images/signature.png?as=avif" type="image/avif" />
          <source srcset="./images/signature.png?as=webp" type="image/webp" />
          <img
            class="guaranteeSignImg"
